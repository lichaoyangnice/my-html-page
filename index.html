        /* 扇形图 */

        .pie-small { width: 20px; height: 20px; }

        .pie-large { width: 50px; height: 50px; margin: 0 auto; }

        /* 主表格区 */
        .main-content { flex: 1; padding: 20px; overflow-y: auto; }
        .header-actions { margin-bottom: 15px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;}
        
        .btn { color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold; }
        .btn-add { background-color: var(--secondary-color); }
        .btn-add:hover { background-color: #2980b9; }
        .btn-copy { background-color: #8e44ad; }

        .btn-save { background-color: #e74c3c; animation: pulse 2s infinite; }

        .btn-small:hover { background-color: #219a52; }
        .btn-del { padding: 4px 6px; font-size: 12px; border-radius: 4px; background-color: #e74c3c; color:white; border:none; cursor:pointer; flex-shrink: 0;}
        .btn-del:hover { background-color: #c0392b; }

        @keyframes pulse {

            70% { box-shadow: 0 0 0 10px rgba(231, 76, 60, 0); }
            100% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0); }

    <script>
        // --- 初始化数据与全局过滤条件 ---
        let kanbanData = [];
        let filters = { product: '', primary: '', secondary: '', owner: '', time: '', status: '' };

        try {
            const dataIsland = document.getElementById('app-data').textContent;
            kanbanData = JSON.parse(dataIsland);
        } catch (e) {
            console.error("读取数据失败", e);
        }

        function generateId() { return Math.random().toString(36).substr(2, 9); }
        function triggerUnsaved() { document.getElementById('unsaved-tip').style.display = 'inline'; render(); }

        // --- 保存到本地 HTML ---
        function saveToHTML() {
            const safeJSON = JSON.stringify(kanbanData).replace(/</g, '\\u003c');
            document.getElementById('app-data').textContent = safeJSON;

            const dashboard = document.getElementById('dashboardContainer');
            const tableBody = document.getElementById('tableBody');
            const oldDashHTML = dashboard.innerHTML;
            const oldTableHTML = tableBody.innerHTML;
            dashboard.innerHTML = '';
            tableBody.innerHTML = '';
            document.getElementById('unsaved-tip').style.display = 'none';

            const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;

            dashboard.innerHTML = oldDashHTML;
            tableBody.innerHTML = oldTableHTML;

            const blob = new Blob([htmlContent], { type: "text/html;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "看板.html";
            a.click();
            URL.revokeObjectURL(url);
            
            alert("✅ 保存成功！\n\n请在下载提示中，选择【覆盖/替换】您原来的文件！");
        }

        // --- 核心计算 ---
        function calculateStats() {
            kanbanData.forEach(product => {
                let prodTotal = 0, prodCompleted = 0;
                product.primaries.forEach(primary => {
                    let primTotal = primary.secondaries.length, primCompleted = 0;
                    primary.secondaries.forEach(sec => {
                        prodTotal++;
                        if (sec.status === '已完成') { primCompleted++; prodCompleted++; }
                    });
                    primary.progress = primTotal === 0 ? 0 : Math.round((primCompleted / primTotal) * 100);
                });
                product.progress = prodTotal === 0 ? 0 : Math.round((prodCompleted / prodTotal) * 100);
            });
        }

        // --- 筛选功能 ---
        function changeFilter(key, val) { filters[key] = val; renderTable(); }
        function clearFilters() { filters = { product: '', primary: '', secondary: '', owner: '', time: '', status: '' }; updateFilterDropdowns(); renderDashboard(); renderTable(); }

        function updateFilterDropdowns() {
            let sets = { product: new Set(), primary: new Set(), secondary: new Set(), owner: new Set(), time: new Set() };
            kanbanData.forEach(p => {
                sets.product.add(p.name.trim());
                p.primaries.forEach(pr => {
                    sets.primary.add(pr.name.trim());
                    pr.secondaries.forEach(s => {
                        sets.secondary.add(s.name.trim()); sets.owner.add(s.owner.trim()); sets.time.add(s.time.trim());
                    });
                });
            });

            const buildOptions = (set, currentVal) => {
                let html = `<option value="">(全部)</option>`;
                Array.from(set).sort().forEach(val => {
                    let optionVal = val === '' ? '__EMPTY__' : val;
                    let displayVal = val === '' ? '(未填写)' : val;
                    html += `<option value="${optionVal}" ${currentVal === optionVal ? 'selected' : ''}>${displayVal}</option>`;
                });
                return html;
            };

            document.getElementById('filter-product').innerHTML = buildOptions(sets.product, filters.product);
            document.getElementById('filter-primary').innerHTML = buildOptions(sets.primary, filters.primary);
            document.getElementById('filter-secondary').innerHTML = buildOptions(sets.secondary, filters.secondary);
            document.getElementById('filter-owner').innerHTML = buildOptions(sets.owner, filters.owner);
            document.getElementById('filter-time').innerHTML = buildOptions(sets.time, filters.time);
            document.getElementById('filter-status').innerHTML = `
                <option value="">(全部)</option>
                <option value="未完成" ${filters.status === '未完成' ? 'selected' : ''}>未完成</option>
                <option value="已完成" ${filters.status === '已完成' ? 'selected' : ''}>已完成</option>
            `;
        }

        // --- 增加数据 ---
        function addProduct() {
            clearFilters();
            const name = prompt("请输入产品名称：");
            if (name && name.trim()) { kanbanData.push({ id: generateId(), name: name.trim(), primaries: [], progress: 0 }); triggerUnsaved(); }
        }

        function duplicateLastProduct() {
            if (kanbanData.length === 0) { alert("当前没有可复制的产品！"); return; }
            clearFilters();
            const lastProduct = kanbanData[kanbanData.length - 1];
            const newName = prompt("【复制结构】请输入新产品的名称：", lastProduct.name + " (副本)");
            if (!newName) return;

            const newProduct = {
                id: generateId(), name: newName.trim(), progress: 0,
                primaries: lastProduct.primaries.map(prim => ({
                    id: generateId(), name: prim.name, progress: 0,
                    secondaries: prim.secondaries.map(sec => ({ id: generateId(), name: sec.name, owner: '', time: '', status: '未完成' }))
                }))
            };
            kanbanData.push(newProduct);
            triggerUnsaved();
        }

        function addPrimary(productId) {
            clearFilters();
            const name = prompt("请输入一级标题名称：");
            if (name && name.trim()) {
                const product = kanbanData.find(p => p.id === productId);
                if (product) { product.primaries.push({ id: generateId(), name: name.trim(), secondaries: [], progress: 0 }); triggerUnsaved(); }
            }
        }

        function addSecondary(productId, primaryId) {
            clearFilters();
            const name = prompt("请输入二级标题名称：");
            if (name && name.trim()) {
                const product = kanbanData.find(p => p.id === productId);
                const primary = product.primaries.find(p => p.id === primaryId);
                if (primary) { primary.secondaries.push({ id: generateId(), name: name.trim(), owner: '', time: '', status: '未完成' }); triggerUnsaved(); }
            }
        }

        // --- 删除数据功能 ---
        function deleteProduct(productId, name) {
            if (confirm(`⚠️ 危险操作！\n确定要删除产品【${name}】吗？\n这会清空该产品下所有的一级、二级标题及进度数据！`)) {
                kanbanData = kanbanData.filter(p => p.id !== productId);
                triggerUnsaved();
            }
        }

        function deletePrimary(productId, primaryId, name) {
            if (confirm(`确定要删除一级标题【${name}】及其下面的所有内容吗？`)) {
                const product = kanbanData.find(p => p.id === productId);
                if (product) {
                    product.primaries = product.primaries.filter(p => p.id !== primaryId);
                    triggerUnsaved();
                }
            }
        }

        function deleteSecondary(productId, primaryId, secondaryId, name) {
            if (confirm(`确定要删除二级标题【${name}】吗？`)) {
                const product = kanbanData.find(p => p.id === productId);
                if (product) {
                    const primary = product.primaries.find(p => p.id === primaryId);
                    if (primary) {
                        primary.secondaries = primary.secondaries.filter(s => s.id !== secondaryId);
                        triggerUnsaved();
                    }
                }
            }
        }

        // --- 修改数据 ---
        function updateTitle(type, productId, primaryId, secondaryId, element) {
            const newVal = element.value.trim();
            if (!newVal) return; 
            const product = kanbanData.find(p => p.id === productId);
            if (type === 'product') { product.name = newVal; } 
            else if (type === 'primary') { product.primaries.find(p => p.id === primaryId).name = newVal; } 
            else if (type === 'secondary') { product.primaries.find(p => p.id === primaryId).secondaries.find(s => s.id === secondaryId).name = newVal; }
            triggerUnsaved();
        }

        function updateField(productId, primaryId, secondaryId, field, element) {
            const product = kanbanData.find(p => p.id === productId);
            const primary = product.primaries.find(p => p.id === primaryId);
            const secondary = primary.secondaries.find(s => s.id === secondaryId);
            if (secondary) { secondary[field] = element.value; triggerUnsaved(); }
        }

        function toggleSubDashboard(id) { document.getElementById('sub-' + id).classList.toggle('active'); }

        // --- 点击左侧产品导航到该产品 ---
        function selectProduct(productId) {
            const product = kanbanData.find(p => p.id === productId);
            if (!product) return;
            const prodName = product.name.trim();
            const sub = document.getElementById('sub-' + productId);
            const item = sub ? sub.closest('.dashboard-item') : null;

            // 已经选中同一个产品：只切换子看板展开状态，不动筛选
            if (filters.product === prodName) {
                if (sub) sub.classList.toggle('active');
                return;
            }

            // 切换产品：清空下级筛选，只保留产品筛选
            filters.product = prodName;
            filters.primary = '';
            filters.secondary = '';
            filters.owner = '';
            filters.time = '';
            filters.status = '';

            updateFilterDropdowns();
            renderTable();

            // 左侧：收起其它子看板，只展开当前选中的，并高亮
            document.querySelectorAll('.sub-dashboard').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.dashboard-item').forEach(el => el.classList.remove('selected'));
            if (sub) sub.classList.add('active');
            if (item) item.classList.add('selected');

            // 右上提示
            const tip = document.getElementById('current-product-tip');
            if (tip) tip.textContent = '🎯 当前显示：' + prodName;

            // 右侧滚动到顶部
            const main = document.querySelector('.main-content');
            if (main) main.scrollTop = 0;
        }

        // --- 显示全部产品 ---
        function showAllProducts() {
            filters = { product: '', primary: '', secondary: '', owner: '', time: '', status: '' };
            updateFilterDropdowns();
            renderTable();
            document.querySelectorAll('.dashboard-item').forEach(el => el.classList.remove('selected'));
            document.querySelectorAll('.sub-dashboard').forEach(el => el.classList.remove('active'));
            const tip = document.getElementById('current-product-tip');
            if (tip) tip.textContent = '';
            const main = document.querySelector('.main-content');
            if (main) main.scrollTop = 0;
        }

        // --- 渲染逻辑 ---
        function render() { calculateStats(); updateFilterDropdowns(); renderDashboard(); renderTable(); }

        function renderDashboard() {
            const container = document.getElementById('dashboardContainer');
            let html = '';
            kanbanData.forEach(product => {
                html += `<div class="dashboard-item" data-product-id="${product.id}">
                            <h4 onclick="selectProduct('${product.id}')">
                                <span>📦 ${product.name}</span>
                                <div class="pie-container">
                                    <span style="font-size:14px; font-weight:normal;">${product.progress}%</span>
                                    <div class="pie-chart pie-medium" style="--p: ${product.progress}%"></div>
                                    <button class="btn-del" title="删除该产品" onclick="event.stopPropagation(); deleteProduct('${product.id}', '${product.name}')">🗑️</button>
                                </div>
                            </h4>
                            <div class="sub-dashboard" id="sub-${product.id}">`;
                product.primaries.forEach(primary => {
                    html += `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                                <span>📄 ${primary.name}</span>
                                <div class="pie-container"><span style="font-size:12px;">${primary.progress}%</span><div class="pie-chart pie-small" style="--p: ${primary.progress}%"></div></div>
                            </div>`;
                });
                html += `</div></div>`;
            });
            container.innerHTML = html;

            // 重绘后恢复"当前选中产品"的高亮与展开状态
            if (filters.product) {
                const selected = kanbanData.find(p => p.name.trim() === filters.product);
                if (selected) {
                    const sub = document.getElementById('sub-' + selected.id);
                    const item = sub ? sub.closest('.dashboard-item') : null;
                    if (sub) sub.classList.add('active');
                    if (item) item.classList.add('selected');
                    const tip = document.getElementById('current-product-tip');
                    if (tip) tip.textContent = '🎯 当前显示：' + selected.name;
                }
            } else {
                const tip = document.getElementById('current-product-tip');
                if (tip) tip.textContent = '';
            }
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            let html = '';
            let displayData = [];
            let hasAnyFilter = Object.values(filters).some(v => v !== '');

            kanbanData.forEach(prod => {
                let checkProd = filters.product === '__EMPTY__' ? '' : filters.product;
                if (filters.product && prod.name.trim() !== checkProd) return;
                
                let hasLowerFilters = filters.primary || filters.secondary || filters.owner || filters.time || filters.status;
                
                if (prod.primaries.length === 0) {
                    if (!hasLowerFilters) displayData.push(prod);
                    return;
                }

                let matchedPrimaries = [];
                prod.primaries.forEach(prim => {
                    let checkPrim = filters.primary === '__EMPTY__' ? '' : filters.primary;
                    if (filters.primary && prim.name.trim() !== checkPrim) return;

                    let hasSecFilters = filters.secondary || filters.owner || filters.time || filters.status;
                    if (prim.secondaries.length === 0) {
                        if (!hasSecFilters) matchedPrimaries.push(prim);
                        return;
                    }

                    let matchedSecondaries = [];
                    prim.secondaries.forEach(sec => {
                        let checkSec = filters.secondary === '__EMPTY__' ? '' : filters.secondary;
                        let checkOwner = filters.owner === '__EMPTY__' ? '' : filters.owner;
                        let checkTime = filters.time === '__EMPTY__' ? '' : filters.time;
                        
                        if (filters.secondary && sec.name.trim() !== checkSec) return;
                        if (filters.owner && sec.owner.trim() !== checkOwner) return;
                        if (filters.time && sec.time.trim() !== checkTime) return;
                        if (filters.status && sec.status.trim() !== filters.status) return;
                        
                        matchedSecondaries.push(sec);
                    });

                    if (matchedSecondaries.length > 0 || (!hasSecFilters && prim.secondaries.length === 0)) {
                        matchedPrimaries.push({ ...prim, secondaries: matchedSecondaries });
                    }
                });

                if (matchedPrimaries.length > 0 || (!hasLowerFilters && prod.primaries.length === 0)) {
                    displayData.push({ ...prod, primaries: matchedPrimaries });
                }
            });

            if (displayData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding: 30px; color: #999;">${hasAnyFilter ? '当前筛选条件下没有匹配的数据' : '暂无数据，请点击【+ 添加新产品】开始'}</td></tr>`;
                return;
            }
            
            displayData.forEach(product => {
                let prodRowspan = 0;
                if (product.primaries.length === 0) prodRowspan = 1;
                else product.primaries.forEach(p => { prodRowspan += p.secondaries.length === 0 ? 1 : p.secondaries.length; });

                if (product.primaries.length === 0) {
                    html += `<tr><td rowspan="${prodRowspan}"><div class="flex-cell"><input type="text" class="edit-title title-bold" value="${product.name}" onchange="updateTitle('product', '${product.id}', null, null, this)"><button class="btn-small" onclick="addPrimary('${product.id}')">+</button><button class="btn-del" title="删除" onclick="deleteProduct('${product.id}', '${product.name}')">🗑️</button></div></td><td colspan="6" style="color:#999; text-align:center;">请添加一级标题</td></tr>`;
                } else {
                    product.primaries.forEach((primary, pIdx) => {
                        let primRowspan = primary.secondaries.length === 0 ? 1 : primary.secondaries.length;
                        if (primary.secondaries.length === 0) {
                            html += `<tr>`;
                            if (pIdx === 0) html += `<td rowspan="${prodRowspan}"><div class="flex-cell"><input type="text" class="edit-title title-bold" value="${product.name}" onchange="updateTitle('product', '${product.id}', null, null, this)"><button class="btn-small" onclick="addPrimary('${product.id}')">+</button><button class="btn-del" title="删除" onclick="deleteProduct('${product.id}', '${product.name}')">🗑️</button></div></td>`;
                            html += `<td rowspan="${primRowspan}"><div class="flex-cell"><input type="text" class="edit-title title-bold" value="${primary.name}" onchange="updateTitle('primary', '${product.id}', '${primary.id}', null, this)"><button class="btn-small" onclick="addSecondary('${product.id}', '${primary.id}')">+</button><button class="btn-del" title="删除" onclick="deletePrimary('${product.id}', '${primary.id}', '${primary.name}')">🗑️</button></div></td><td colspan="4" style="color:#999; text-align:center;">请添加二级标题</td>`;
                            if (pIdx === 0) html += `<td rowspan="${prodRowspan}" class="center"><div class="pie-chart pie-large" style="--p: ${product.progress}%"></div><div style="margin-top:5px; font-weight:bold; color:#2c3e50;">${product.progress}%</div></td>`;
                            html += `</tr>`;
                        } else {
                            primary.secondaries.forEach((sec, sIdx) => {
                                html += `<tr>`;
                                if (pIdx === 0 && sIdx === 0) html += `<td rowspan="${prodRowspan}"><div class="flex-cell"><input type="text" class="edit-title title-bold" value="${product.name}" onchange="updateTitle('product', '${product.id}', null, null, this)"><button class="btn-small" onclick="addPrimary('${product.id}')">+</button><button class="btn-del" title="删除" onclick="deleteProduct('${product.id}', '${product.name}')">🗑️</button></div></td>`;
                                
                                if (sIdx === 0) html += `<td rowspan="${primRowspan}">
                                    <div class="flex-cell">
                                        <input type="text" class="edit-title title-bold" value="${primary.name}" onchange="updateTitle('primary', '${product.id}', '${primary.id}', null, this)">
                                        <button class="btn-small" onclick="addSecondary('${product.id}', '${primary.id}')">+</button>
                                        <button class="btn-del" title="删除" onclick="deletePrimary('${product.id}', '${primary.id}', '${primary.name}')">🗑️</button>
                                    </div>
                                    <div style="margin-top:10px; display:flex; align-items:center; gap:5px; font-size:12px; color:#3498db; background:#f0f8ff; padding:4px; border-radius:4px;"><div class="pie-chart pie-small" style="--p: ${primary.progress}%"></div> 进度: ${primary.progress}%</div>
                                </td>`;
                                
                                const statusClass = sec.status === '已完成' ? 'status-done' : 'status-undone';
                                html += `<td><div class="flex-cell"><input type="text" class="edit-title" value="${sec.name}" onchange="updateTitle('secondary', '${product.id}', '${primary.id}', '${sec.id}', this)"><button class="btn-del" title="删除" onclick="deleteSecondary('${product.id}', '${primary.id}', '${sec.id}', '${sec.name}')">🗑️</button></div></td>
                                        <td><input type="text" placeholder="输入姓名..." value="${sec.owner}" onchange="updateField('${product.id}', '${primary.id}', '${sec.id}', 'owner', this)"></td>
                                        <td><input type="date" value="${sec.time}" onchange="updateField('${product.id}', '${primary.id}', '${sec.id}', 'time', this)"></td>
                                        <td><select class="${statusClass}" onchange="updateField('${product.id}', '${primary.id}', '${sec.id}', 'status', this)"><option value="未完成" ${sec.status === '未完成' ? 'selected' : ''}>未完成</option><option value="已完成" ${sec.status === '已完成' ? 'selected' : ''}>已完成</option></select></td>`;
                                        
                                if (pIdx === 0 && sIdx === 0) html += `<td rowspan="${prodRowspan}" class="center"><div class="pie-chart pie-large" style="--p: ${product.progress}%"></div><div style="margin-top:8px; font-size:16px; font-weight:bold; color: ${product.progress===100?'#27ae60':'#2c3e50'}">${product.progress}%</div></td>`;
                                html += `</tr>`;
                            });
                        }
                    });
                }
            });
            tbody.innerHTML = html;
        }
        
        render();
    </script>

</body></html>
